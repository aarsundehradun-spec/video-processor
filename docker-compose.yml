version: '3.8'
services:
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    # Map tmp dirs to local disk for easy inspection during dev
    volumes:
      - ./uploads:/tmp/meta-remover-uploads
      - ./outputs:/tmp/meta-remover-outputs

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
